# Linux packages and language tools, read by the run_onchange_* scripts.
# macOS packages live in ../../Brewfile. Editing a list re-runs its script on
# the next `chezmoi apply`; removing an entry does not uninstall it.
packages:
  # Fedora (dnf): run_onchange_before_10-install-packages-linux.sh.tmpl
  fedora:
    shell:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tmux
      - vim-enhanced
      - neovim
      - fzf
    cli:
      - git
      - git-lfs
      - git-delta
      - gh
      - curl
      - jq
      - yq
      - ripgrep
      - fd-find
      - bat
      - tree
      - htop
      - fastfetch
      - strace
      - ShellCheck
      - neomutt
    dev:
      - golang
      - nodejs-npm
      - pipx
    # `dnf builddep kernel` also runs when this list is non-empty
    kernel:
      - b4
      - git-email
      - lei
      - sparse
      - coccinelle
      - bear
      - virtme-ng
      - dkms
      - gcc-aarch64-linux-gnu
      - qemu-system-aarch64
      - debootstrap
      - libstdc++-static
      - glibc-static
      - perl-open
      - python3-GitPython
    docs:
      - texlive-scheme-full
      - graphviz
      - python3-sphinx
    monitoring:
      - nvtop
      - s-tui
      - stress
      - smem
      - fio
      - vulkan-tools
    services:
      - tailscale  # repo added by the script
      - ttyd
      - distrobox
      - valkey-compat-redis
      - gfs2-utils
    locale:
      - langpacks-en
      - langpacks-ja
      - glibc-langpack-en

  # Debian/Ubuntu (apt): remote nodes and ISUCON servers
  debian:
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - tmux
    - vim
    - git
    - curl
    - jq
    - fzf
    - tree
    - htop

  # Language tools: run_onchange_after_40-dev-tools.sh.tmpl
  go:
    all:
      - golang.org/x/tools/gopls@latest
      - golang.org/x/tools/cmd/goimports@latest
      - honnef.co/go/tools/cmd/staticcheck@latest
      - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    linux:
      - google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
  cargo:
    # delta: git diffs, hyperfine: command benchmarks, oha: HTTP load testing
    darwin:
      - git-delta
      - hyperfine
      - oha
    linux:
      - aichat
      - mdbook
      - mdbook-mermaid
  pipx:
    linux:
      - oterm
  npm:
    linux:
      - "@bufbuild/buf"
      - "@google/gemini-cli"
